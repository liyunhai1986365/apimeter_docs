    post:
      summary: 即梦视频生成
      description: |
        即梦官方 API 格式的视频生成接口。

        支持通过 Action 参数指定操作类型：
        - `CVSync2AsyncSubmitTask`: 提交视频生成任务
        - `CVSync2AsyncGetResult`: 获取任务结果

        需要在查询参数中指定 Action 和 Version。
      operationId: createJimengVideo
      tags:
        - 视频系列
      parameters:
        - name: Action
          in: query
          description: API 操作类型
          required: true
          schema:
            type: string
            enum:
              - CVSync2AsyncSubmitTask
              - CVSync2AsyncGetResult
        - name: Version
          in: query
          description: API 版本
          required: true
          example: '2022-08-31'
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: 即梦官方 API 请求格式
              properties:
                req_key:
                  type: string
                  description: 请求类型标识
                prompt:
                  type: string
                  description: 文本描述
                binary_data_base64:
                  type: array
                  items:
                    type: string
                  description: Base64 编码的图片数据
            example:
              req_key: jimeng_video_generation
              prompt: 一只猫在弹钢琴
      responses:
        '200':
          description: 成功处理请求
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 响应码
                  message:
                    type: string
                    description: 响应消息
                  data:
                    type: object
                    description: 响应数据
                    properties: {}
          headers: {}
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: {}
      security:
        - bearerAuth: []
