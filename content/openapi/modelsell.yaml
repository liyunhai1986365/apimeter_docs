          type: array
          description: 参考图片列表。
          items:
            $ref: '#/components/schemas/GrokVideoReference'
        video:
          allOf:
            - $ref: '#/components/schemas/GrokVideoReference'
          description: 参考视频。
    GrokVideoReference:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: 参考素材的公网 URL。
    Seedance2VideoTaskRequest:
      type: object
      required:
        - model
        - content
      properties:
        model:
          type: string
          description: Seedance 2.0 模型 ID。
          enum:
            - doubao-seedance-2-0-260128
            - doubao-seedance-2-0-fast-260128
          example: doubao-seedance-2-0-260128
        content:
          type: array
          description: Seedance 2.0 官方格式的内容数组。
          minItems: 1
          items:
            $ref: '#/components/schemas/Seedance2ContentItem'
        generate_audio:
          type: boolean
          description: 是否生成与画面同步的声音，默认 true。
          default: true
        resolution:
          type: string
          description: 输出分辨率，默认 720p。标准版官方支持 480p、720p、1080p、4k；Fast 仅支持 480p、720p。4k 需确认平台渠道已开放。
          enum:
            - 480p
            - 720p
            - 1080p
            - 4k
          default: 720p
          example: 480p
        ratio:
          type: string
          description: 输出宽高比，adaptive 根据输入与任务自动选择。
          enum:
            - '16:9'
            - '9:16'
            - '3:4'
            - '1:1'
            - '4:3'
            - '21:9'
            - adaptive
          default: adaptive
          example: '16:9'
        duration:
          type: integer
          description: 生成视频时长，整数 4 到 15 秒；-1 表示模型智能选择。示例显式指定 5 秒。
          anyOf:
            - minimum: 4
              maximum: 15
            - const: -1
          example: 5
        watermark:
          type: boolean
          description: 是否添加水印，默认 false。
          default: false
      allOf:
        - if:
            properties:
              model:
                const: doubao-seedance-2-0-fast-260128
          then:
            properties:
              resolution:
                enum: [480p, 720p]
    Seedance2ContentItem:
      type: object
      description: Seedance 2.0 输入内容。首帧、首尾帧、全模态参考为互斥模式；全模态最多 9 张图片、3 段视频、3 段音频，音频必须搭配图片或视频。视频总时长与音频总时长分别不超过 15 秒。
      required:
        - type
      properties:
        type:
          type: string
          description: 内容类型。
          enum:
            - text
            - image_url
            - video_url
            - audio_url
        text:
          type: string
          description: 提示词或内容描述。`type` 为 `text` 时填写。
          example: 一只金色柴犬在樱花树下奔跑，镜头缓缓上升
        image_url:
          type: object
          required: [url]
          description: 图片支持公网 URL、Base64 Data URL 或 asset://<asset_id>。单张小于 30 MB，原生请求体不超过 64 MB，大文件优先用 URL。
          properties:
            url:
              type: string
              description: 图片公网 URL、data:image/<format>;base64,... 或可用的 asset://<asset_id>。
              example: https://example.com/photo.jpg
        video_url:
          type: object
          required: [url]
          description: 参考视频支持公网 URL 或 asset://<asset_id>，不支持 Base64。单个 2 到 15 秒且不超过 200 MB，24 到 60 FPS；最多 3 段且总时长不超过 15 秒。
          properties:
            url:
              type: string
              format: uri
              description: 参考视频公网 URL 或可用的 asset://<asset_id>。
              example: https://example.com/reference-video.mp4
        audio_url:
          type: object
          required: [url]
          description: 参考音频支持公网 URL、Base64 Data URL 或 asset://<asset_id>。wav/mp3，单个 2 到 15 秒且不超过 15 MB；最多 3 段且总时长不超过 15 秒。
          properties:
            url:
              type: string
              description: 音频公网 URL、data:audio/<format>;base64,... 或可用的 asset://<asset_id>。
              example: https://example.com/reference_audio.mp3
        role:
          type: string
          description: 首帧图片用 first_frame（单图可省略），首尾帧图片分别用 first_frame/last_frame；全模态图片用 reference_image，视频用 reference_video，音频用 reference_audio。首尾帧不能与全模态参考混用。
          enum:
            - first_frame
            - last_frame
            - reference_image
            - reference_video
            - reference_audio
    Seedance2VideoTaskCreated:
      type: object
      description: 创建任务的响应。创建为异步操作，此时仅返回任务 ID，需另行查询任务状态和结果。
      required: [id]
      properties:
        id:
          type: string
          description: 视频生成任务 ID，原样保存并用于查询，不依赖固定前缀。
          example: cgt-2026xxxx-xxxx
    Seedance2VideoTask:
      type: object
      description: Seedance 2.0 视频任务对象。
      properties:
        id:
          type: string
          description: 视频生成任务 ID。
          example: task_UPUfjg0S3UXekH2OgTZBXyqgGhsxgkp6
        status:
          type: string
          description: 任务状态。
          enum:
            - queued
            - running
            - succeeded
            - failed
            - expired
            - cancelled
          example: queued
        model:
          type: string
          description: 使用的 Seedance 2.0 模型。
          example: doubao-seedance-2-0-260128
        created_at:
          type: integer
          description: 创建时间，Unix 秒级时间戳。
        updated_at:
          type: integer
          description: 任务状态更新时间，Unix 秒级时间戳。
        duration:
          type: integer
          description: 生成视频的时长约数（整数秒），实际总帧数除以 24 后向下取整，可能与精确时长不同。
        resolution:
          type: string
          description: 实际生成视频的分辨率。
        ratio:
          type: string
          description: 实际生成视频的宽高比。
        framespersecond:
          type: integer
          description: 实际生成视频的帧率。
        generate_audio:
          type: boolean
          description: 生成的视频是否包含同步音频。
        content:
          type: object
          description: 成功后的生成结果。
          properties:
            video_url:
              type: string
              format: uri
              description: 生成视频下载 URL，官方有效期为 24 小时，应及时下载或转存；平台渠道行为以实际返回为准。
              example: https://example.com/doubao-seedance-2-0/result.mp4
        usage:
          type: object
          description: 本次任务用量。
          properties:
            completion_tokens:
              type: integer
              description: 任务消耗的 completion tokens。
              example: 100858
            total_tokens:
              type: integer
              description: 总 token 数；官方视频生成不统计输入 token，因此与 completion_tokens 相同。平台计费以渠道规则为准。
        error:
          type: [object, 'null']
          description: 任务失败时的错误信息；任务成功时可返回 null。
          properties:
            code:
              type: string
              description: 错误码。
              example: invalid_parameter
            message:
              type: string
              description: 错误信息。
              example: 视频格式不支持
