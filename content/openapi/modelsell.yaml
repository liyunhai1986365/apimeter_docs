                    description: Suno 任务 ID。
                    example: f9761a3e-b396-4060-a35b-a26bbce7ba9b
                  status:
                    type: integer
                    description: 提交后的任务状态值。
                    example: 1
                  title:
                    type: string
                    description: 歌曲标题。
                  prompt:
                    type: string
                    description: 提交时的提示词或歌词。
                    example: 美女
          description: Suno 任务 ID 或任务列表。
        message:
          type: string
          description: 提交结果消息。
          example: ''
        exec_time:
          type: number
          description: 上游接口执行耗时，单位通常为秒。
        ip:
          type: string
          description: 上游返回的请求来源 IP。
      additionalProperties: true
    SunoTaskResponse:
      type: object
      description: Suno 单任务查询响应。
