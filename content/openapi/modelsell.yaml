openapi: 3.1.0
info:
  title: ModelSell API
  version: 1.0.0
  description: |
    ModelSell API 参考文档，按远端中文 API 文档目录同步分类。包含 AI 模型接口和管理接口， 每个接口都可在生成的 API Reference 中使用 Playground 调试。
servers:
  - url: https://modelsell.com
tags:
  - name: AI 模型 - 聊天
    description: Claude、OpenAI ChatCompletions、OpenAI Responses、Responses Compact 与 Gemini 文本/媒体聊天接口。
  - name: AI 模型 - 补全
    description: OpenAI Completions 兼容的文本补全接口。
  - name: AI 模型 - 嵌入
    description: OpenAI 与 Gemini 兼容的文本向量化接口。
  - name: AI 模型 - 图像
    description: OpenAI Images、Qwen 图像生成/编辑与 Gemini 图像接口。
  - name: AI 模型 - 模型列表
    description: OpenAI、Claude 与 Gemini 兼容的模型列表和模型详情查询接口。
  - name: AI 模型 - 视频
    description: OpenAI/Sora、Kling、即梦、HappyHorse、PixVerse、Seedance、Veo、万相等视频生成、任务查询和内容下载接口。
  - name: AI 模型 - 音频
    description: OpenAI Audio 兼容的音频转录、音频翻译和文本转语音接口。
  - name: AI 模型 - 重排序
    description: Rerank 文档重排序接口。
  - name: AI 模型 - 内容审核
    description: Moderations 内容安全审核接口。
  - name: AI 模型 - 实时
    description: OpenAI Realtime 兼容 WebSocket 接口。
  - name: 管理接口 - 鉴权
    description: 管理接口使用 Bearer Token，也可通过 New-Api-User 请求头指定管理用户上下文。
  - name: 管理接口 - 令牌管理
    description: API 令牌创建、更新、查询、搜索、删除、批量删除和密钥查看接口。
  - name: 管理接口 - 日志
    description: 请求日志查询、搜索、统计、按令牌查询和历史日志删除接口。
  - name: 管理接口 - 真人认证
    description: BytePlus 真人认证会话、人像素材和素材组管理接口。
security:
  - bearerAuth: []
paths:
  /v1/messages:
    post:
      operationId: createMessage
      summary: Claude 格式
      description: |
        Anthropic Claude Messages API 兼容请求。需要在请求头中包含 `anthropic-version`。
      tags:
        - AI 模型 - 聊天
      parameters:
        - name: anthropic-version
          in: header
          required: true
          description: Anthropic API 版本。
          schema:
            type: string
            example: '2023-06-01'
        - name: x-api-key
          in: header
          required: false
          description: 可选的 Anthropic 风格 API Key 请求头，也可使用 Bearer Token。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaudeMessageRequest'
            examples:
              basic:
                summary: Claude 消息请求
                value:
                  model: claude-sonnet-4-5-20250929
                  max_tokens: 1024
                  messages:
                    - role: user
                      content: 你好，请用一句话介绍 ModelSell。
      responses:
        '200':
          description: Claude 消息响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: ChatCompletions 格式
      description: |
        OpenAI Chat Completions 兼容接口。支持标准聊天请求，也可用于通过 OpenAI 聊天格式调用具备图像能力的 Gemini 模型。
      tags:
        - AI 模型 - 聊天
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
            examples:
              basic:
                summary: 基础聊天请求
                value:
                  model: gpt-5.4-nano
                  messages:
                    - role: user
                      content: Write a concise launch note.
              vision:
                summary: 图片理解请求
                value:
                  model: gemini-2.5-flash
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: 这张图里有什么？
                        - type: image_url
                          image_url:
                            url: https://example.com/image.png
      responses:
        '200':
          description: Chat Completions 响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/responses:
    post:
      operationId: createResponse
      summary: Responses 格式
      description: |
        OpenAI Responses API 兼容接口，支持单轮/多轮输入、工具调用和推理参数。
      tags:
        - AI 模型 - 聊天
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
            examples:
              basic:
                value:
                  model: gpt-5.4-nano
                  input: 你好
      responses:
        '200':
          description: Responses 响应对象。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/completions:
    post:
      operationId: createCompletion
      summary: 原生 OpenAI 格式
      description: OpenAI Completions 兼容的文本补全接口。
      tags:
        - AI 模型 - 补全
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompletionRequest'
            examples:
              basic:
                value:
                  model: gpt-5.4-nano
                  prompt: 讲一个关于 API 网关的短故事。
                  max_tokens: 256
      responses:
        '200':
          description: 文本补全响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: 嵌入（Embeddings）
      description: >
        OpenAI Embeddings API 兼容接口，用于将文本转换为向量。支持
        `gemini-embedding-001`、`text-embedding-004`、`amazon.titan-embed-text-v2:0` 等模型。
      tags:
        - AI 模型 - 嵌入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
            examples:
              gemini:
                value:
                  model: gemini-embedding-001
                  input: ModelSell 是一个企业级 AI API 网关
              batch:
                value:
                  model: text-embedding-004
                  input:
                    - 第一段文本
                    - 第二段文本
                  dimensions: 768
      responses:
        '200':
          description: 向量嵌入响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1beta/models/{model}:generateContent:
    post:
      operationId: generateGeminiContent
      summary: Gemini 文本聊天 / 媒体识别
      description: |
        Gemini `generateContent` 兼容接口，用于文本聊天和媒体识别请求。
      tags:
        - AI 模型 - 聊天
      parameters:
        - $ref: '#/components/parameters/GeminiModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
            examples:
              text:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 你好，请介绍 ModelSell。
              media:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 描述这张图片。
                        - inline_data:
                            mime_type: image/png
                            data: BASE64_IMAGE_DATA
      responses:
        '200':
          description: Gemini 内容生成响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiGenerateContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1beta/models/{model}:generateContent/:
    post:
      operationId: generateGeminiImageContent
      summary: Gemini 原生格式
      description: Gemini 兼容的图像生成接口，路径带尾部斜杠。
      tags:
        - AI 模型 - 图像
      parameters:
        - $ref: '#/components/parameters/GeminiModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
            examples:
              image:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 生成一张 ModelSell 控制台插图。
      responses:
        '200':
          description: Gemini 图像生成响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiGenerateContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/images/generations:
    post:
      operationId: createImageGeneration
      summary: 生成图像
      description: OpenAI Images API 兼容的图像生成接口。
      tags:
        - AI 模型 - 图像
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageGenerationRequest'
            examples:
              basic:
                value:
                  model: gpt-image-1
                  prompt: 一张未来感 API 网关控制台截图
                  size: 1024x1024
      responses:
        '200':
          description: 图像生成响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/images/edits:
    post:
      operationId: editImage
      summary: 编辑图像
      description: OpenAI Images API 兼容的图像编辑接口。
      tags:
        - AI 模型 - 图像
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditImageRequest'
      responses:
        '200':
          description: 图像编辑响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/models:
    get:
      operationId: listModels
      summary: OpenAI 格式
      description: 查询当前 API Key 可用的 OpenAI 兼容模型列表。
      tags:
        - AI 模型 - 模型列表
      responses:
        '200':
          description: 可用模型列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1beta/models:
    get:
      operationId: listGeminiModels
      summary: Gemini 格式
      description: 查询当前 API Key 可用的 Gemini 兼容模型列表。
      tags:
        - AI 模型 - 模型列表
      responses:
        '200':
          description: 可用 Gemini 模型列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/video/generations:
    post:
      operationId: createVideoGeneration
      summary: 创建视频生成任务
      description: |
        创建视频生成任务。该通用接口覆盖 HappyHorse、Seedance、Veo、万相等 `/v1/video/generations` 提供商。
      tags:
        - AI 模型 - 视频
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoGenerationRequest'
            examples:
              textToVideo:
                value:
                  model: veo-3.1-generate-preview
                  prompt: 一只机械手臂在现代工厂中组装芯片
                  duration: 8
                  size: '16:9'
              imageToVideo:
                value:
                  model: seedance-1-0-lite-i2v
                  prompt: 让图片中的产品缓慢旋转
                  image: https://example.com/product.png
      responses:
        '200':
          description: 视频任务响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/video/generations/{task_id}:
    get:
      operationId: getVideoGeneration
      summary: 查询视频生成任务
      description: 查询 `/v1/video/generations` 视频任务状态与结果。
      tags:
        - AI 模型 - 视频
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 视频任务响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/videos:
    post:
      operationId: createOpenAIVideo
      summary: OpenAI 兼容视频生成
      description: |
        通过 OpenAI 兼容的 `/v1/videos` 接口创建视频生成任务，适用于 PixVerse、Veo、Seedance 等兼容提供商。
      tags:
        - AI 模型 - 视频
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoGenerationRequest'
            examples:
              pixverse:
                value:
                  model: pixverse-v4.5
                  prompt: 城市夜景中的霓虹招牌缓慢亮起
                  duration: 5
                  aspect_ratio: '16:9'
      responses:
        '200':
          description: OpenAI 兼容视频任务响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/videos/{task_id}:
    get:
      operationId: getOpenAIVideo
      summary: 查询 OpenAI 兼容视频任务
      description: 查询 OpenAI 兼容 `/v1/videos` 任务状态与结果。
      tags:
        - AI 模型 - 视频
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OpenAI 兼容视频任务响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/videos/{task_id}/content:
    get:
      operationId: downloadVideoContent
      summary: 下载视频内容
      description: 下载已生成的视频内容，适用于提供 content 端点的视频模型。
      tags:
        - AI 模型 - 视频
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 生成的视频文件。
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/log/:
    get:
      operationId: listLogs
      summary: 获取所有日志
      description: 获取当前用户可见的全部请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
      responses:
        '200':
          description: 日志列表响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
    delete:
      operationId: deleteLogs
      summary: 删除历史日志
      description: 删除当前用户可见的历史请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchIdsRequest'
      responses:
        '200':
          description: 删除结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementResponse'
  /api/log/search:
    get:
      operationId: searchLogs
      summary: 搜索日志
      description: 按关键词和常用筛选条件搜索请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 日志搜索响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
  /api/log/self:
    get:
      operationId: listSelfLogs
      summary: 获取个人日志
      description: 获取当前用户自己的请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 个人日志列表响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
  /api/log/self/search:
    get:
      operationId: searchSelfLogs
      summary: 搜索个人日志
      description: 搜索当前用户自己的请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 个人日志搜索响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
  /api/log/self/stat:
    get:
      operationId: getSelfLogStat
      summary: 获取个人日志统计
      description: 获取当前用户自己的请求日志统计。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
      responses:
        '200':
          description: 个人日志统计响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementResponse'
  /api/log/stat:
    get:
      operationId: getLogStat
      summary: 获取日志统计
      description: 获取聚合请求日志统计。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/StartTimestamp'
        - $ref: '#/components/parameters/EndTimestamp'
      responses:
        '200':
          description: 日志统计响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementResponse'
  /api/log/token:
    get:
      operationId: getTokenLogs
      summary: 通过令牌获取日志
      description: 获取指定 API 令牌关联的请求日志。
      tags:
        - 管理接口 - 日志
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - name: token_name
          in: query
          required: false
          description: 令牌名称。
          schema:
            type: string
        - name: token_id
          in: query
          required: false
          description: 令牌 ID。
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 令牌日志响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
  /api/token/:
    get:
      operationId: listTokens
      summary: 获取所有令牌
      description: 获取当前用户可见的全部 API 令牌。
      tags:
        - 管理接口 - 令牌管理
      security:
        - bearerAuth: []
        - newApiUser: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 令牌列表响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
    post:
      operationId: createToken
      summary: 创建令牌
      description: 创建新的 API 令牌。
      tags:
        - 管理接口 - 令牌管理
      security:
        - bearerAuth: []
        - newApiUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTokenRequest'
            examples:
              basic:
                value:
                  name: default
                  remain_quota: 500000
                  expired_time: -1
      responses:
        '200':
          description: 创建令牌响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
    put:
      operationId: updateToken
      summary: 更新令牌
      description: 更新已有 API 令牌。
      tags:
        - 管理接口 - 令牌管理
      security:
        - bearerAuth: []
        - newApiUser: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTokenRequest'
      responses:
        '200':
          description: 更新令牌响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /api/token/batch:
    post:
      operationId: batchDeleteTokens
      summary: 批量删除令牌
      description: 一次请求删除多个 API 令牌。
      tags:
        - 管理接口 - 令牌管理
      security:
        - bearerAuth: []
