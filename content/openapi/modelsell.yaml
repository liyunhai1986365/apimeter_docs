            application/json:
              schema:
                $ref: '#/components/schemas/Seedance2VideoTaskCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v3/contents/generations/tasks/{task_id}:
    get:
      operationId: getSeedance2VideoTask
      summary: 查询 Seedance 2.0 视频任务
      description: |
        查询 Seedance 2.0 异步视频任务。queued/running 继续轮询，succeeded 读取 content.video_url，failed/expired 停止轮询并检查 error，cancelled 表示已取消并停止轮询。官方仅支持查询最近 7 天任务，取消记录 24 小时后自动删除，视频 URL 有效期为 24 小时；平台渠道行为可能不同，应及时下载或转存。客户端停止轮询不会取消服务端任务。
      tags:
        - 视频系列
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Seedance 2.0 视频任务状态响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seedance2VideoTask'
              examples:
                running:
                  summary: 生成中
                  value:
                    id: task_UPUfjg0S3UXekH2OgTZBXyqgGhsxgkp6
                    status: running
                    model: doubao-seedance-2-0-260128
                succeeded:
                  summary: 生成成功
                  value:
                    id: task_UPUfjg0S3UXekH2OgTZBXyqgGhsxgkp6
                    status: succeeded
                    model: doubao-seedance-2-0-260128
                    content:
                      video_url: https://example.com/doubao-seedance-2-0/result.mp4
                    usage:
                      completion_tokens: 100858
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assets/upload:
    post:
      operationId: uploadSeedanceAsset
      summary: 上传 Seedance 2.0 素材
      description: |
        上传图片、视频或音频素材到当前用户素材库。素材上传接口同时支持国内版本和海外版本模型：国内版本模型不需要传入 `model` 查询参数；海外版本 `dreamina-seedance-2-0-fast-260128` 需要在请求地址添加 `?model=dreamina-seedance-2-0-fast-260128`，系统会选择对应的海外版本素材渠道。

        该接口为平台封装，使用平台 Bearer API Key；不同于官方 AK/SK 签名的 CreateAsset。只接受公网 URL，不支持 Base64。上传返回 data.Id 不代表素材已就绪，需查询 Status：Processing 继续等待、Active 可用、Failed 停止。普通非人像素材可直接用 URL；私域虚拟人像库不替代真人授权。仅将同渠道下 Active 的 asset://<asset_id> 用于后续生成。
      tags:
        - 视频系列
      parameters:
        - name: model
          in: query
          required: false
          description: 指定用于选择素材上传渠道的模型 ID。上传 `dreamina-seedance-2-0-fast-260128` 海外版本素材时传入该参数。
          schema:
            type: string
          example: dreamina-seedance-2-0-fast-260128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeedanceAssetUploadRequest'
            examples:
              domesticImage:
                summary: 国内版本模型上传图片素材
                description: 请求地址使用 `/api/assets/upload`，不需要传入 `model` 查询参数。
                value:
                  url: https://example.com/image.png
                  asset_type: Image
                  name: 示例图片
              overseasImage:
                summary: 海外版本模型上传图片素材
                description: 请求地址使用 `/api/assets/upload?model=dreamina-seedance-2-0-fast-260128`。
                value:
                  url: https://example.com/image.png
                  asset_type: Image
                  name: 示例图片
              video:
                summary: 上传视频素材
                value:
                  url: https://example.com/reference-video.mp4
                  asset_type: Video
                  name: 参考视频
              audio:
                summary: 上传音频素材
                value:
                  url: https://example.com/reference-audio.mp3
                  asset_type: Audio
                  name: 参考音频
      responses:
        '200':
          description: 素材上传响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedanceAssetUploadResponse'
              example:
                code: 0
                message: ok
                data:
                  Id: asset-20260325152211-vcchd
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/assets/{id}:
    get:
      operationId: getSeedanceAsset
      summary: 查询 Seedance 2.0 素材详情
      description: |
        根据素材 ID 查询平台素材详情，同时检查业务 code 与 data.Status。Processing 继续等待，Active 可用，Failed 停止。上传与查询必须使用一致渠道；方舟素材及素材组按 ProjectName 隔离，生成时也需同项目权限。使用 asset://<asset_id>，不要误用 GroupId。
      tags:
        - 视频系列
      parameters:
        - $ref: '#/components/parameters/SeedanceAssetId'
        - name: model
          in: query
          required: false
          description: 指定用于选择素材详情查询渠道的模型 ID。查询 `dreamina-seedance-2-0-fast-260128` 海外版本素材时传入该参数。
          schema:
            type: string
          example: dreamina-seedance-2-0-fast-260128
      responses:
        '200':
          description: 素材详情响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedanceAssetResponse'
              example:
