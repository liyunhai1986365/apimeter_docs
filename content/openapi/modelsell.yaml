  /v1/video/generations:
    post:
      operationId: createVideoGeneration
      summary: 创建视频生成任务
      description: |
        创建视频生成任务。该通用接口覆盖 HappyHorse、Seedance、Veo、万相等 `/v1/video/generations` 提供商。

        使用 Seedance 2.0 时，通用字段会转换为官方 `content[]` 格式：`prompt` 转为文本内容，`image` 或 `images` 转为参考图片，`metadata.video_url` 转为参考视频，`metadata.audio_url` 转为参考音频，`size` 转为 `resolution`，`metadata.ratio` 转为 `ratio`。创建成功后保存返回的任务 ID，并通过 `GET /v1/video/generations/{task_id}` 轮询结果。
      tags:
        - 视频系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoGenerationRequest'
            examples:
              textToVideo:
                summary: Seedance 2.0 文生视频
                value:
                  model: doubao-seedance-2-0-260128
                  prompt: 一只金色柴犬在樱花树下奔跑，镜头缓缓上升
                  duration: 5
                  size: 480p
                  metadata:
                    ratio: '16:9'
                    watermark: false
                    generate_audio: true
              imageToVideo:
                summary: Seedance 2.0 图生视频
                value:
                  model: doubao-seedance-2-0-fast-260128
                  prompt: 让画面中的人物缓缓转身微笑
                  image: https://example.com/photo.jpg
                  duration: 5
                  size: 720p
                  metadata:
                    ratio: '16:9'
                    generate_audio: true
                    watermark: false
              videoAudio:
                summary: Seedance 2.0 视频与音频引用
                value:
                  model: doubao-seedance-2-0-260128
                  prompt: 根据音频内容为视频添加匹配的音效
                  duration: 5
                  size: 480p
                  metadata:
                    ratio: '16:9'
                    video_url: https://example.com/reference-video.mp4
                    audio_url: https://example.com/reference-audio.mp3
                    generate_audio: true
                    watermark: false
              imageAudioToVideo:
                summary: Seedance 2.0 音画协同
                value:
                  model: doubao-seedance-2-0-260128
                  prompt: 让人物根据音频内容说话
                  image: https://example.com/reference-image.jpg
                  duration: 5
                  size: 480p
                  metadata:
                    ratio: '16:9'
                    audio_url: https://example.com/reference-audio.mp3
                    watermark: false
              imageVideoReference:
                summary: Seedance 2.0 多重引用
                value:
                  model: doubao-seedance-2-0-260128
                  prompt: 按照图片的风格，修改这个视频
                  image: https://example.com/reference-image.jpg
                  duration: 5
                  size: 480p
                  metadata:
                    ratio: '16:9'
                    video_url: https://example.com/reference-video.mp4
                    watermark: false
              allModalities:
                summary: Seedance 2.0 全模态生成
                value:
                  model: doubao-seedance-2-0-fast-260128
                  prompt: 使用图片的风格，把这个声音应用在女主说话的场景，并修改这个视频
                  image: https://example.com/reference-image.jpg
                  duration: 5
                  size: 720p
                  metadata:
                    ratio: '16:9'
                    video_url: https://example.com/reference-video.mp4
                    audio_url: https://example.com/reference-audio.mp3
                    generate_audio: true
                    watermark: false
      responses:
        '200':
          description: 视频任务响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
