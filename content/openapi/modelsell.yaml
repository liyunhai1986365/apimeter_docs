  /suno/submit/music:
    post:
      summary: Suno 生成音乐
      description: |
        提交 Suno 音乐生成任务，成功后返回 Suno 任务 ID，可通过 `/suno/fetch/{task_id}` 查询结果。生成音乐接口只提交任务，不直接返回最终音频；部分兼容接口会一次返回两个 Suno 任务 ID，客户端需要分别轮询或等待 Webhook 回调。

        支持 Suno 灵感模式、固定自定义歌词模式、续写、纯音乐和音轨分离等参数组合。灵感模式通常传入 `gpt_description_prompt`、`tags`、`mv` 和 `title`；固定自定义歌词模式传入 `prompt` 歌词文本；音轨分离可传入 `task: gen_stem`、`continue_clip_id`、`stem_task` 等字段。`prompt` 在自定义模式最多 3000 字，灵感模式最多 200 字；`tags` 风格标签最多 120 字。传入知名艺术家名称可能无法生成。

        `mv` 表示 Suno 模型版本，常用可选值包括 `chirp-v4`、`chirp-v3-5`、`chirp-bluejay`、`chirp-auk`、`chirp-fenix`。其中 `chirp-fenix` 对应 Suno 5.5 / 最新版；不传时通常按渠道默认模型处理。

        已兼容 GoAmz 格式，GoAmz 接入地址前缀为 `{{BaseURL}}/suno/v1`，GoAmz 切换 v3.5 接入地址前缀为 `{{BaseURL}}/suno/v1/mv-3.5`。已兼容 SunoAPI 格式，SunoAPI 接入地址前缀为 `{{BaseURL}}/suno`。
      operationId: createSunoMusic
      tags:
        - AI 模型 - 音频
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SunoMusicRequest'
            examples:
              inspiration:
                summary: Suno 灵感模式
                value:
                  gpt_description_prompt: ''
                  tags: emotional punk
                  mv: chirp-fenix
                  title: 乡愁
              customLyrics:
                summary: 固定自定义歌词模式
                value:
                  prompt: "[Verse]\nWalking down the streets..."
                  tags: emotional punk
                  mv: chirp-crow
                  title: City Lights
              stem:
                summary: 音轨分离
                value:
                  task: gen_stem
                  generation_type: TEXT
                  title: 安全之弦
                  mv: chirp-auk
                  prompt: ''
                  make_instrumental: true
                  continue_clip_id: 90f72668-ba0d-4fa7-95e6-f71bebda88b7
                  continued_aligned_prompt: null
                  continue_at: null
                  stem_type_id: 91
                  stem_type_group_name: Two
                  stem_task: two
              formStyle:
                summary: multipart/form-data 兼容字段
                value:
                  callback_url: https://webhook.site/9e499891-8d20-4f2d-8abb-1b2743a880dd
                  custom_mode: 1
                  make_instrumental: 0
                  prompt: "[Verse]\n风吹过 没有声音\n树影摇晃 像梦境"
                  mv: chirp-v4
                  title: 美女
                  tags: Trance, bass drop, female vocal, armin van buren style
                  negative_tags: dance pop
      responses:
        '200':
          description: Suno 音乐任务提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunoSubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
