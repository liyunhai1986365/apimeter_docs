components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 使用 Authorization Bearer API Key 进行鉴权。
    newApiUser:
      type: apiKey
      in: header
      name: New-Api-User
      description: 可选的管理接口用户上下文请求头。
  parameters:
    GeminiModel:
      name: model
      in: path
      required: true
      description: Gemini 兼容接口路径中的模型 ID。
      schema:
        type: string
      example: gemini-2.5-flash
    TaskId:
      name: task_id
      in: path
      required: true
      description: 视频生成任务 ID。
      schema:
        type: string
      example: task_123456
    Id:
      name: id
      in: path
      required: true
      description: 资源 ID。
      schema:
        type: integer
      example: 1
    AssetId:
      name: asset_id
      in: path
      required: true
      description: 人像素材 ID。
      schema:
        type: string
      example: asset_123456
    Keyword:
      name: keyword
      in: query
      required: false
      description: 搜索关键词。
      schema:
        type: string
    Page:
      name: p
      in: query
      required: false
      description: 页码，从 1 开始。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页返回数量。
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
    StartTimestamp:
      name: start_timestamp
      in: query
      required: false
      schema:
        type: integer
      description: 开始时间，Unix 秒级时间戳。
    EndTimestamp:
      name: end_timestamp
      in: query
      required: false
      schema:
        type: integer
      description: 结束时间，Unix 秒级时间戳。
  responses:
    Unauthorized:
      description: API Key 缺失或无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过于频繁。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateClaudeMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: claude-sonnet-4-5-20250929
        messages:
          type: array
          description: 按顺序排列的 Claude 对话消息列表。
          minItems: 1
          items:
            $ref: '#/components/schemas/ClaudeMessageInput'
        system:
          description: 系统提示词，可以是字符串或内容块数组。
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
        max_tokens:
          type: integer
          description: 生成回复时允许输出的最大 token 数。
          minimum: 1
          example: 1024
        temperature:
          type: number
          description: 采样温度，数值越高输出越随机。
          minimum: 0
          maximum: 2
        top_p:
          type: number
          description: 核采样参数，用于控制候选 token 的累计概率范围。
        top_k:
          type: integer
          description: 仅从概率最高的前 K 个候选 token 中采样。
        stream:
          type: boolean
          description: 是否以流式方式返回响应。
        stop_sequences:
          type: array
          description: 遇到这些字符串时停止生成。
          items:
            type: string
        tools:
          type: array
          description: 可供模型调用的工具定义列表。
          items:
            type: object
            additionalProperties: true
        tool_choice:
          description: 工具调用策略，可以指定自动选择或强制调用某个工具。
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        thinking:
          type: object
          description: Claude 推理/思考相关配置。
          additionalProperties: true
        metadata:
          type: object
          description: 请求元数据，用于业务侧追踪或透传。
          additionalProperties: true
    ClaudeMessageInput:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: 消息角色。
          enum:
            - user
            - assistant
        content:
          description: 消息内容，可以是纯文本或多模态内容块数组。
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
    ClaudeMessage:
      type: object
      properties:
        id:
          type: string
          description: Claude 消息 ID。
          example: msg_123
        type:
          type: string
          description: 对象类型，通常为 `message`。
          example: message
        role:
          type: string
          description: 响应消息角色。
          example: assistant
        content:
          type: array
          description: 模型返回的内容块列表。
          items:
            $ref: '#/components/schemas/ContentBlock'
        model:
          type: string
          description: 实际响应使用的模型 ID。
        stop_reason:
          type: string
          description: 生成停止原因。
        usage:
          $ref: '#/components/schemas/Usage'
    CreateChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-5.4-nano
        messages:
          type: array
          description: 按顺序排列的对话消息列表。
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          description: 采样温度，数值越高输出越随机。
          minimum: 0
          maximum: 2
          default: 0.7
        top_p:
          type: number
          description: 核采样参数，用于控制候选 token 的累计概率范围。
        max_tokens:
          type: integer
          description: 生成回复时允许输出的最大 token 数。
          minimum: 1
        stream:
          type: boolean
          description: 是否以流式方式返回响应。
        tools:
          type: array
          description: 可供模型调用的工具定义列表。
          items:
            type: object
            additionalProperties: true
        tool_choice:
          description: 工具调用策略，可以指定自动选择或强制调用某个工具。
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        response_format:
          type: object
          description: 响应格式约束，例如 JSON Object 或 JSON Schema。
          additionalProperties: true
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: 消息角色。
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          description: 消息内容，可以是纯文本或多模态内容块数组。
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentBlock'
        name:
          type: string
          description: 可选的参与者名称。
        tool_call_id:
          type: string
          description: 工具响应消息对应的工具调用 ID。
        tool_calls:
          type: array
          description: 模型请求调用的工具列表。
          items:
            type: object
            additionalProperties: true
    ChatCompletion:
      type: object
      required:
        - id
        - object
        - model
        - choices
      properties:
        id:
          type: string
          description: Chat Completions 响应 ID。
          example: chatcmpl_123
        object:
          type: string
          description: 对象类型。
          example: chat.completion
        created:
          type: integer
          description: 响应创建时间，Unix 秒级时间戳。
        model:
          type: string
          description: 实际响应使用的模型 ID。
        choices:
          type: array
          description: 模型生成的候选回复列表。
          items:
            type: object
            properties:
              index:
                type: integer
                description: 候选回复序号。
              message:
                $ref: '#/components/schemas/ChatMessage'
              delta:
                type: object
                description: 流式响应中的增量内容。
                additionalProperties: true
              finish_reason:
                type: string
                description: 生成停止原因。
        usage:
          $ref: '#/components/schemas/Usage'
    CreateResponseRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-5.4-nano
        input:
          description: Responses API 的输入内容，可以是字符串或消息对象数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        instructions:
          type: string
          description: 给模型的系统级指令。
        max_output_tokens:
          type: integer
          description: 生成回复时允许输出的最大 token 数。
        temperature:
          type: number
          description: 采样温度，数值越高输出越随机。
        top_p:
          type: number
          description: 核采样参数，用于控制候选 token 的累计概率范围。
        stream:
          type: boolean
          description: 是否以流式方式返回响应。
        tools:
          type: array
          description: 可供模型调用的工具定义列表。
          items:
            type: object
            additionalProperties: true
        tool_choice:
          description: 工具调用策略，可以指定自动选择或强制调用某个工具。
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        reasoning:
          type: object
          description: 推理模型相关配置。
          additionalProperties: true
        previous_response_id:
          type: string
          description: 上一轮 response ID，用于延续上下文。
        truncation:
          type: string
          description: 输入超出上下文窗口时的截断策略。
    ResponseObject:
      type: object
      properties:
        id:
          type: string
          description: Responses 响应 ID。
          example: resp_123
        object:
          type: string
          description: 对象类型。
          example: response
        status:
          type: string
          description: 响应状态。
        model:
          type: string
          description: 实际响应使用的模型 ID。
        output:
          type: array
          description: 模型输出项列表。
          items:
            type: object
            additionalProperties: true
        output_text:
          type: string
          description: 聚合后的文本输出。
        usage:
          $ref: '#/components/schemas/Usage'
    CreateCompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-5.4-nano
        prompt:
          description: 文本补全提示词，可以是字符串或字符串数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        suffix:
          type: string
          description: 插入补全时追加在生成内容后的后缀。
        max_tokens:
          type: integer
          description: 生成回复时允许输出的最大 token 数。
        temperature:
          type: number
          description: 采样温度，数值越高输出越随机。
        top_p:
          type: number
          description: 核采样参数，用于控制候选 token 的累计概率范围。
        stream:
          type: boolean
          description: 是否以流式方式返回响应。
        stop:
          description: 停止生成的字符串或字符串数组。
          oneOf:
            - type: string
            - type: array
