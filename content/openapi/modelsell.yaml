  /api/v3/contents/generations/tasks:
    post:
      operationId: createSeedance2VideoTask
      summary: Seedance 2.0 视频生成
      description: |
        使用 Seedance 2.0 原生 `content[]` 格式创建异步任务。支持文生视频、首帧、首尾帧和全模态参考；首帧/首尾帧与全模态参考不能混用。音频必须搭配图片或视频。图片参考、视频编辑与延长通过对应参考角色及提示词表达。

        若希望使用 ModelSell 的通用视频格式，也可以调用 `/v1/video/generations`，通过 `prompt`、`image`、`images`、`metadata.video_url`、`metadata.audio_url` 等字段提交。

        普通非人像参考素材可直接使用公网 URL，无需全部入库。需要使用私域虚拟人像素材时，按素材管理流程上传并查询至 `Active` 后，在 `content[].*_url.url` 中传入 `asset://<asset_id>`；真人素材需另走授权流程。`/api/assets/upload` 是平台封装，不是官方 CreateAsset。
