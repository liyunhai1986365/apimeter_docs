openapi: 3.1.0
info:
  title: ModelSell API
  version: 1.0.0
  description: |
    ModelSell API 参考文档，按账户、聊天、图片、视频等公开能力分类。包含 AI 模型接口和管理接口，每个接口都可在生成的 API Reference 中使用 Playground 调试。
servers:
  - url: /
tags:
  - name: 账户管理
    description: API Key 认证、模型列表和账户侧查询接口。
  - name: 聊天系列
    description: OpenAI Chat Completions、OpenAI Responses、Responses Compact、Claude Messages 与 Gemini 原生文本/媒体聊天接口。
  - name: AI 模型 - 嵌入
    description: OpenAI 与 Gemini 兼容的文本向量化接口。
  - name: 图片系列
    description: OpenAI Images 兼容生成/编辑、Gemini 原生图像和图片异步任务查询接口。
  - name: 视频系列
    description: OpenAI 兼容视频、通用视频、Grok、Kling、即梦等视频生成、任务查询和内容下载接口。
  - name: AI 模型 - 音频
    description: OpenAI Audio 兼容的音频转录、音频翻译、文本转语音，以及 Suno 音乐生成、歌词生成、任务查询和音频素材接口。
  - name: AI 模型 - 重排序
    description: Rerank 文档重排序接口。
  - name: AI 模型 - 内容审核
    description: Moderations 内容安全审核接口。
  - name: AI 模型 - 实时
    description: OpenAI Realtime 兼容 WebSocket 接口。
  - name: 管理接口 - 鉴权
    description: 管理接口使用 Bearer Token，也可通过 New-Api-User 请求头指定管理用户上下文。
  - name: 管理接口 - 令牌管理
    description: API 令牌创建、更新、查询、搜索、删除、批量删除和密钥查看接口。
  - name: 管理接口 - 日志
    description: 请求日志查询、搜索、统计、按令牌查询和历史日志删除接口。
  - name: 管理接口 - 真人认证
    description: BytePlus 真人认证会话、人像素材和素材组管理接口。
security:
  - bearerAuth: []
paths:
  /v1/messages:
    post:
      operationId: createMessage
      summary: Claude 格式
      description: |
        Anthropic Claude Messages API 兼容请求。需要在请求头中包含 `anthropic-version`。
      tags:
        - 聊天系列
      parameters:
        - name: anthropic-version
          in: header
          required: true
          description: Anthropic API 版本。
          schema:
            type: string
            example: '2023-06-01'
        - name: x-api-key
          in: header
          required: false
          description: 可选的 Anthropic 风格 API Key 请求头，也可使用 Bearer Token。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaudeMessageRequest'
            examples:
              basic:
                summary: Claude 消息请求
                value:
                  model: claude-sonnet-4-5-20250929
                  max_tokens: 1024
                  messages:
                    - role: user
                      content: 你好，请用一句话介绍 ModelSell。
      responses:
        '200':
          description: Claude 消息响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: ChatCompletions 格式
      description: |
        OpenAI Chat Completions 兼容接口。支持文本、多模态输入、工具调用和流式响应。
      tags:
        - 聊天系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatCompletionRequest'
            examples:
              basic:
                summary: 基础聊天请求
                value:
                  model: gpt-5.4-nano
                  messages:
                    - role: user
                      content: Write a concise launch note.
              vision:
                summary: 图片理解请求
                value:
                  model: gemini-2.5-flash
                  messages:
                    - role: user
                      content:
                        - type: text
                          text: 这张图里有什么？
                        - type: image_url
                          image_url:
                            url: https://example.com/image.png
              mimo_asr:
                summary: MiMo 语音识别
                value:
                  model: mimo-v2.5-asr
                  messages:
                    - role: user
                      content:
                        - type: input_audio
                          input_audio:
                            data: data:audio/mpeg;base64,BASE64_AUDIO_DATA
                  asr_options:
                    language: auto
              mimo_tts:
                summary: MiMo 语音合成
                value:
                  model: mimo-v2.5-tts
                  messages:
                    - role: user
                      content: 请使用自然、温暖的语气。
                    - role: assistant
                      content: 欢迎使用 ModelSell 语音合成服务。
                  audio:
                    format: wav
                    voice: 冰糖
      responses:
        '200':
          description: Chat Completions 响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/responses:
    post:
      operationId: createResponse
      summary: Responses 格式
      description: |
        OpenAI Responses API 兼容接口，支持单轮/多轮输入、工具调用和推理参数。
      tags:
        - 聊天系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseRequest'
            examples:
              basic:
                value:
                  model: gpt-5.4-nano
                  input: 你好
      responses:
        '200':
          description: Responses 响应对象。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/completions:
    post:
      operationId: createCompletion
      summary: 原生 OpenAI 格式
      description: OpenAI Completions 兼容的文本补全接口。
      tags:
        - 聊天系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompletionRequest'
            examples:
              basic:
                value:
                  model: gpt-5.4-nano
                  prompt: 讲一个关于 API 网关的短故事。
                  max_tokens: 256
      responses:
        '200':
          description: 文本补全响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Completion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: 嵌入（Embeddings）
      description: >
        OpenAI Embeddings API 兼容接口，用于将文本转换为向量。支持
        `gemini-embedding-001`、`text-embedding-004`、`amazon.titan-embed-text-v2:0` 等模型。
      tags:
        - AI 模型 - 嵌入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
            examples:
              gemini:
                value:
                  model: gemini-embedding-001
                  input: ModelSell 是一个企业级 AI API 网关
              batch:
                value:
                  model: text-embedding-004
                  input:
                    - 第一段文本
                    - 第二段文本
                  dimensions: 768
      responses:
        '200':
          description: 向量嵌入响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1beta/models/{model}:generateContent:
    post:
      operationId: generateGeminiContent
      summary: Gemini 文本聊天 / 媒体识别
      description: |
        Gemini `generateContent` 兼容接口，用于文本聊天和媒体识别请求。
      tags:
        - 聊天系列
      parameters:
        - $ref: '#/components/parameters/GeminiModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
            examples:
              text:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 你好，请介绍 ModelSell。
              media:
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 描述这张图片。
                        - inline_data:
                            mime_type: image/png
                            data: BASE64_IMAGE_DATA
      responses:
        '200':
          description: Gemini 内容生成响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiGenerateContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1beta/models/{model}:generateContent/:
    post:
      operationId: generateGeminiImageContent
      summary: Gemini 原生图像生成
      description: |
        Gemini 官方 `generateContent` REST 格式的图像生成接口。请求体使用 `contents[].parts[]` 传入文本和图片，使用 `generationConfig.responseModalities` 请求图片输出。兼容 `/v1beta/models/{model}:generateContent` 与 `/v1/models/{model}:generateContent` 路径。
      tags:
        - 图片系列
      parameters:
        - $ref: '#/components/parameters/GeminiModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
            examples:
              textToImage:
                summary: 文生图
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 生成一张高级质感的产品摄影图，干净通透，柔和自然光，细节清晰。
                  generationConfig:
                    responseModalities:
                      - IMAGE
                    imageConfig:
                      aspectRatio: 4:3
                      imageSize: 2K
              imageEdit:
                summary: 参考图编辑
                value:
                  contents:
                    - role: user
                      parts:
                        - text: 去除画面中所有人物，保留空间结构，生成干净通透的高级摄影画面。
                        - inlineData:
                            mimeType: image/png
                            data: BASE64_IMAGE_DATA
                  generationConfig:
                    responseModalities:
                      - IMAGE
                    imageConfig:
                      aspectRatio: 16:9
                      imageSize: 2K
      responses:
        '200':
          description: Gemini 图像生成响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeminiGenerateContentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/images/generations:
    post:
      operationId: createImageGeneration
      summary: 生成图像
      description: |
        OpenAI Images API 兼容的图像生成接口。默认同步返回图片结果；如需异步提交，在请求 URL 上携带 `?async=true`，接口会返回图片任务 ID，可通过 `/v1/tasks/{id}` 查询结果。
      tags:
        - 图片系列
      parameters:
        - $ref: '#/components/parameters/ImageAsync'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageGenerationRequest'
            examples:
              basic:
                value:
                  model: gpt-image-1
                  prompt: 一张未来感 API 网关控制台截图
                  size: 1024x1024
              seedream5Pro:
                summary: Seedream 5.0 Pro 文生图
                value:
                  model: doubao-seedream-5-0-pro-260628
                  prompt: 生成一张 16:9 未来感 API 控制台产品海报
                  size: 2K
                  output_format: png
                  response_format: url
                  watermark: false
              seedream5LiteSequence:
                summary: Seedream 5.0 Lite 文生组图
                value:
                  model: doubao-seedream-5-0-260128
                  prompt: 生成一组 4 张连贯插画，表现同一庭院春夏秋冬的变化
                  size: 2K
                  sequential_image_generation: auto
                  sequential_image_generation_options:
                    max_images: 4
                  stream: false
                  output_format: png
                  watermark: false
              seedream5LiteWebSearch:
                summary: Seedream 5.0 Lite 联网搜索
                value:
                  model: doubao-seedream-5-0-lite-260128
                  prompt: 制作一张上海未来 5 日天气预报信息图
                  size: 3K
                  tools:
                    - type: web_search
                  output_format: png
                  watermark: false
              async:
                summary: 异步提交
                value:
                  model: gpt-image-1
                  prompt: 一张未来感 API 网关控制台截图
                  size: 1024x1024
      responses:
        '200':
          description: 成功响应。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImageResponse'
                  - $ref: '#/components/schemas/ImageAsyncSubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/images/edits:
    post:
      operationId: editImage
      summary: 编辑图像
      description: |
        OpenAI Images API 兼容的图像编辑接口。默认同步返回编辑后的图片结果；如需异步提交，在请求 URL 上携带 `?async=true`，接口会返回图片任务 ID，可通过 `/v1/tasks/{id}` 查询结果。
      tags:
        - 图片系列
      parameters:
        - $ref: '#/components/parameters/ImageAsync'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditImageRequest'
      responses:
        '200':
          description: 成功响应。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImageResponse'
                  - $ref: '#/components/schemas/ImageAsyncSubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tasks/{id}:
    get:
      operationId: getImageAsyncTask
      summary: 查询图片异步任务
      description: |
        仅适用于在 `/v1/images/generations?async=true` 或 `/v1/images/edits?async=true` 提交后返回的图片任务 ID。

        建议客户端按固定间隔轮询该接口：当任务为 `succeeded` 且 `data.images` 非空时读取图片结果；当任务为 `failed` 时读取 `error` 字段并停止轮询。图片结果可能包含 `url` 或 `b64_json`，具体取决于模型、渠道能力和提交请求中的 `response_format`。
      tags:
        - 图片系列
      parameters:
        - name: id
          in: path
          required: true
          description: 图片异步任务 ID。
          schema:
            type: string
            example: task_abc123
      responses:
        '200':
          description: 成功响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageTaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /mj/submit/imagine:
    post:
      operationId: createMidjourneyImagine
      summary: Midjourney 提交绘图
      description: |
        提交 Midjourney 绘图任务。可在 prompt 中携带 Midjourney 参数，例如 `--v 6.1`、`--ar 1:1`、`--fast`、`--relax`。

        如需使用快速或休闲专用入口，也可以在兼容网关上使用对应前缀路径：`mj-fast/mj/submit/imagine` 或 `mj-relax/mj/submit/imagine`。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyImagineRequest'
            examples:
              basic:
                value:
                  state: ''
                  notifyHook: ''
                  botType: MID_JOURNEY
                  prompt: a girl --v 6.1 --ar 1:1
                  base64Array: []
                  accountFilter: {}
      responses:
        '200':
          description: Midjourney 任务提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneySubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/submit/edits:
    post:
      operationId: editMidjourneyImage
      summary: Midjourney 图片编辑
      description: 使用 Midjourney 图片编辑接口提交参考图片与编辑提示词，返回可轮询的 Midjourney 任务 ID。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyEditRequest'
            examples:
              basic:
                value:
                  prompt: 几只鸟在飞
                  image: https://file.rixapi.com/mask.png
      responses:
        '200':
          description: Midjourney 图片编辑任务提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneySubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/submit/video:
    post:
      operationId: createMidjourneyVideo
      summary: Midjourney 视频生成
      description: 基于 Midjourney 图片任务或参考图片提交视频生成动作，返回任务 ID 后可通过 Midjourney 查询任务接口轮询结果。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyVideoRequest'
            examples:
              imageToVideo:
                value:
                  prompt: 飞来一只蜜蜂
                  motion: low
                  image: https://example.com/midjourney-image.png
                  endImage: https://example.com/end-frame.png
      responses:
        '200':
          description: Midjourney 视频任务提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneySubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/task/{task_id}/fetch:
    get:
      operationId: getMidjourneyTask
      summary: Midjourney 查询任务
      description: 根据 Midjourney 任务 ID 查询单个任务详情，包括状态、进度、图片 URL、视频 URL、按钮和扩展属性。
      tags:
        - 图片系列
      parameters:
        - $ref: '#/components/parameters/MidjourneyTaskId'
      responses:
        '200':
          description: Midjourney 任务详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /mj/task/list-by-condition:
    post:
      operationId: listMidjourneyTasksByCondition
      summary: Midjourney 批量查询任务
      description: 按 Midjourney 任务 ID 列表批量查询任务详情。适合在客户端保存多个任务 ID 后一次性刷新任务状态。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyTaskListRequest'
            examples:
              byIds:
                value:
                  ids:
                    - '1751700106922083'
      responses:
        '200':
          description: Midjourney 任务详情列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MidjourneyTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/insight-face/swap:
    post:
      operationId: createMidjourneyFaceSwap
      summary: Midjourney 换脸任务
      description: 提交 InsightFace 换脸任务。请求体传入源人脸图片和目标图片的 Base64 Data URL，成功后返回 Midjourney 任务 ID。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyFaceSwapRequest'
            examples:
              basic:
                value:
                  sourceBase64: data:image/jpeg;base64,BASE64_SOURCE_IMAGE
                  targetBase64: data:image/jpeg;base64,BASE64_TARGET_IMAGE
      responses:
        '200':
          description: Midjourney 换脸任务提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneySubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/submit/action:
    post:
      operationId: submitMidjourneyAction
      summary: Midjourney 提交动作
      description: |
        对已有 Midjourney 任务提交动作，例如 U 放大、V 变幻、Reroll 重新生成、Zoom 或局部重绘前置动作。

        `customId` 来自任务查询结果中的按钮数据。部分局部重绘流程会先调用本接口获取 modal，再调用 `/mj/submit/modal` 提交遮罩和提示词。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyActionRequest'
            examples:
              upscale:
                value:
                  state: ''
                  notifyHook: ''
                  taskId: '1754413313273733'
                  customId: MJ::JOB::upsample::1::68923902a083468cc96dd7eb
              inpaint:
                value:
                  state: ''
                  notifyHook: ''
                  taskId: '1754413711269468'
                  customId: MJ::Inpaint::1::68923902a083468cc96dd7eb::SOLO
      responses:
        '200':
          description: Midjourney 动作提交响应。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MidjourneySubmitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /mj/submit/modal:
    post:
      operationId: submitMidjourneyModal
      summary: Midjourney 局部重绘
      description: 提交 Midjourney 局部重绘 modal 内容。通常先通过 `/mj/submit/action` 的 Inpaint 按钮动作获取可重绘任务，再提交提示词和遮罩图。
      tags:
        - 图片系列
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MidjourneyModalRequest'
            examples:
              inpaint:
                value:
                  state: ''
                  notifyHook: ''
                  prompt: ''
                  taskId: '1754413925342220'
                  maskBase64: data:image/png;base64,BASE64_MASK_IMAGE
      responses:
        '200':
          description: Midjourney 局部重绘提交响应。
