        max_tokens:
          type: integer
          description: 生成回复时允许输出的最大 token 数。
        temperature:
          type: number
          description: 采样温度，数值越高输出越随机。
        top_p:
          type: number
          description: 核采样参数，用于控制候选 token 的累计概率范围。
        stream:
          type: boolean
          description: 是否以流式方式返回响应。
        stop:
          description: 停止生成的字符串或字符串数组。
          oneOf:
            - type: string
            - type: array
