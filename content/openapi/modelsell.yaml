    GeminiGenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          description: Gemini 请求内容列表，每项包含角色和 parts。
          minItems: 1
          items:
            type: object
            properties:
              role:
                type: string
                description: 内容角色。
                enum:
                  - user
                  - model
              parts:
                type: array
                description: 文本、图片或其他多模态内容块。
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      description: 文本提示词。
                    inlineData:
                      type: object
                      description: Gemini 官方内联媒体字段，使用 camelCase。
                      properties:
                        mimeType:
                          type: string
                          description: IANA MIME 类型，例如 image/png、image/jpeg、image/webp。
                          example: image/png
                        data:
                          type: string
                          format: byte
                          description: 不带 Data URL 前缀的 Base64 媒体数据。
                    fileData:
                      type: object
                      description: Gemini 官方文件 URI 媒体字段。
                      properties:
                        mimeType:
                          type: string
                          description: IANA MIME 类型。
                        fileUri:
                          type: string
                          description: 文件 URI。
                  additionalProperties: true
        systemInstruction:
          type: object
          description: Gemini 系统指令。
          additionalProperties: true
        generationConfig:
          type: object
          description: Gemini 生成参数，例如温度、topP、最大输出 token、图片输出模态等。
          properties:
            temperature:
              type: number
              description: 采样温度。
            topP:
              type: number
              description: topP 采样参数。
            topK:
              type: integer
              description: topK 采样参数。
            maxOutputTokens:
              type: integer
              description: 最大输出 token 数。
            candidateCount:
              type: integer
              description: 候选结果数量。
            responseModalities:
              type: array
              description: 请求输出模态。图像生成必须包含 IMAGE；空列表等价于只请求文本。
              items:
                type: string
                enum:
                  - TEXT
                  - IMAGE
                  - AUDIO
            imageConfig:
              type: object
              description: Gemini 图片生成配置。仅适用于支持该配置的图像模型。
              properties:
                aspectRatio:
                  type: string
                  description: 输出比例，例如 1:1、4:3、16:9、9:16、21:9。
                  example: 16:9
                imageSize:
                  type: string
                  description: 输出尺寸档位，例如 512、1K、2K、4K。
                  example: 2K
            thinkingConfig:
              type: object
              description: Gemini 思考配置。
              additionalProperties: true
          additionalProperties: true
        safetySettings:
          type: array
          description: Gemini 安全设置列表。
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          description: Gemini 可调用工具定义列表。
          items:
            type: object
            additionalProperties: true
    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          description: Gemini 返回的候选结果列表。
          items:
            type: object
            additionalProperties: true
        promptFeedback:
          type: object
          description: 输入提示的安全或拦截反馈。
          additionalProperties: true
        usageMetadata:
          type: object
          description: token 使用量等统计信息。
          additionalProperties: true
    CreateImageGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-image-1
        prompt:
          type: string
          description: 生成或编辑图像时使用的文本提示词。
        'n':
          type: integer
          description: 需要生成的图片数量。
          minimum: 1
        size:
          type: string
          enum:
            - 1K
            - 2K
            - 3K
            - 4K
            - 1024x1024
            - 1536x1024
            - 1024x1536
            - 2048x2048
            - 2048x1152
            - 3840x2160
            - 2160x3840
          description: |
            图片尺寸。常用参数：
            - `1024x1024`：square / 正方形
            - `1536x1024`：landscape / 横向
            - `1024x1536`：portrait / 竖屏
            - `2048x2048`：2K square / 2K 正方形
            - `2048x1152`：2K landscape / 2K 横向
            - `3840x2160`：4K landscape / 4K 横向
            - `2160x3840`：4K portrait / 4K 竖屏
          example: 1024x1024
        quality:
          type: string
          description: 图片质量参数。
        style:
          type: string
          description: 图片风格参数。
        response_format:
          type: string
          description: 返回图片 URL 或 Base64 编码。
          enum:
            - url
            - b64_json
        user:
          type: string
          description: 终端用户标识，用于安全审计或滥用检测。
        image:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: |
            Seedream 等模型的参考图片。支持单个 URL/Base64 Data URL，或多个图片组成的数组。
            Seedream 5.0 Pro 最多 10 张；Seedream 5.0 Lite 最多 14 张。
        output_format:
          type: string
          enum:
            - png
            - jpeg
          description: Seedream 5.0 输出文件格式。
        watermark:
          type: boolean
          default: true
          description: 是否在图片右下角添加“AI 生成”水印。
        optimize_prompt_options:
          type: object
          description: Seedream 提示词优化配置。Lite 仅支持 standard，Pro 支持 standard 与 fast。
          properties:
            mode:
              type: string
              enum:
                - standard
                - fast
              default: standard
        sequential_image_generation:
          type: string
          enum:
            - auto
            - disabled
          default: disabled
          description: Seedream 5.0 Lite 组图开关；Pro 不支持。
        sequential_image_generation_options:
          type: object
          description: Seedream 5.0 Lite 组图配置，仅在 sequential_image_generation=auto 时生效。
          properties:
            max_images:
              type: integer
              minimum: 1
              maximum: 15
              default: 15
              description: 最大输出图片数；输入参考图数与最终输出图数合计不得超过 15。
        stream:
          type: boolean
          default: false
          description: Seedream 5.0 Lite SSE 流式输出开关；Pro 不支持。
        tools:
          type: array
          description: Seedream 5.0 Lite 工具列表。
