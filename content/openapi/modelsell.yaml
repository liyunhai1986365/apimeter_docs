                type: string
    Completion:
      type: object
      properties:
        id:
          type: string
          description: 文本补全响应 ID。
          example: cmpl_123
        object:
          type: string
          description: 对象类型。
          example: text_completion
        model:
          type: string
          description: 实际响应使用的模型 ID。
        choices:
          type: array
          description: 模型生成的候选补全列表。
          items:
            type: object
            properties:
              text:
                type: string
                description: 生成的补全文本。
              index:
                type: integer
                description: 候选补全序号。
              finish_reason:
                type: string
                description: 生成停止原因。
        usage:
          $ref: '#/components/schemas/Usage'
    CreateEmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gemini-embedding-001
        input:
          description: 用于生成向量的输入文本，部分模型支持字符串数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        dimensions:
          type: integer
          description: 输出向量维度，部分模型支持压缩到指定维度。
        encoding_format:
          type: string
          description: 向量编码格式。
          enum:
            - float
            - base64
    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          description: 对象类型。
          example: list
        data:
          type: array
          description: 向量结果列表。
          items:
            type: object
            properties:
              object:
                type: string
                description: 对象类型。
                example: embedding
              index:
                type: integer
                description: 当前向量在输入列表中的序号。
              embedding:
                type: array
                description: 浮点数组形式的向量。
                items:
                  type: number
        model:
          type: string
          description: 实际生成向量使用的模型 ID。
        usage:
          $ref: '#/components/schemas/Usage'
    GeminiGenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          description: Gemini 请求内容列表，每项包含角色和 parts。
          minItems: 1
          items:
            type: object
            properties:
              role:
                type: string
                description: 内容角色。
                enum:
                  - user
                  - model
              parts:
                type: array
                description: 文本、图片或其他多模态内容块。
                items:
                  type: object
                  additionalProperties: true
        systemInstruction:
          type: object
          description: Gemini 系统指令。
          additionalProperties: true
        generationConfig:
          type: object
          description: Gemini 生成参数，例如温度、topP、最大输出 token 等。
          additionalProperties: true
        safetySettings:
          type: array
          description: Gemini 安全设置列表。
          items:
            type: object
            additionalProperties: true
        tools:
          type: array
          description: Gemini 可调用工具定义列表。
          items:
            type: object
            additionalProperties: true
    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          description: Gemini 返回的候选结果列表。
          items:
            type: object
            additionalProperties: true
        promptFeedback:
          type: object
          description: 输入提示的安全或拦截反馈。
          additionalProperties: true
        usageMetadata:
          type: object
          description: token 使用量等统计信息。
          additionalProperties: true
    CreateImageGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-image-1
        prompt:
          type: string
          description: 生成或编辑图像时使用的文本提示词。
        'n':
          type: integer
          description: 需要生成的图片数量。
          minimum: 1
        size:
          type: string
          description: 图片尺寸。
          example: 1024x1024
        quality:
          type: string
          description: 图片质量参数。
        style:
          type: string
          description: 图片风格参数。
        response_format:
          type: string
          description: 返回图片 URL 或 Base64 编码。
          enum:
            - url
            - b64_json
        user:
          type: string
          description: 终端用户标识，用于安全审计或滥用检测。
    EditImageRequest:
      type: object
      required:
        - image
        - prompt
      properties:
        image:
          type: string
          format: binary
          description: 需要编辑的原始图片文件。
        mask:
          type: string
          format: binary
          description: 可选遮罩图片文件，用于指定编辑区域。
        model:
          type: string
          description: 要调用的模型 ID。
          example: gpt-image-1
        prompt:
          type: string
          description: 生成或编辑图像时使用的文本提示词。
        'n':
          type: integer
          description: 需要生成的图片数量。
        size:
          type: string
          description: 图片尺寸。
        response_format:
          type: string
          description: 返回图片 URL 或 Base64 编码。
    ImageResponse:
      type: object
      properties:
        created:
          type: integer
          description: 图片生成时间，Unix 秒级时间戳。
        data:
          type: array
          description: 图片结果列表。
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: 图片访问 URL。
              b64_json:
                type: string
                description: Base64 编码的图片内容。
              revised_prompt:
                type: string
                description: 模型改写后的提示词。
    ListModelsResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          description: 对象类型。
          example: list
        data:
          type: array
          description: OpenAI 兼容模型列表。
          items:
            $ref: '#/components/schemas/Model'
    GeminiModelsResponse:
      type: object
      properties:
        models:
          type: array
          description: Gemini 兼容模型列表。
          items:
            type: object
            additionalProperties: true
    Model:
      type: object
      required:
        - id
        - object
      properties:
        id:
          type: string
          description: 模型 ID。
          example: modelsell-chat
        object:
          type: string
          description: 对象类型。
          example: model
        owned_by:
          type: string
          description: 模型归属方。
        context_window:
          type: integer
          description: 模型上下文窗口大小。
          example: 128000
        created:
          type: integer
          description: 模型创建时间，Unix 秒级时间戳。
    CreateVideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: 要调用的模型 ID。
          example: veo-3.1-generate-preview
        prompt:
          type: string
          description: 视频生成提示词，描述希望生成的视频内容。
        image:
          type: string
          format: uri
          description: 单张参考图片 URL，用于图生视频。
        images:
          type: array
          description: 多张参考图片 URL，用于支持多图输入的模型。
          items:
            type: string
            format: uri
        duration:
          description: 生成视频时长，单位通常为秒，具体取值以模型为准。
          oneOf:
            - type: integer
            - type: string
        size:
          type: string
          description: 视频比例或尺寸，例如 `16:9`。
          example: '16:9'
        aspect_ratio:
          type: string
          description: 视频画面比例。
          example: '16:9'
        resolution:
          type: string
          description: 输出视频分辨率。
        seed:
          type: integer
          description: 随机种子，用于复现相似结果。
        fps:
          type: integer
          description: 输出视频帧率。
        negative_prompt:
          type: string
          description: 负向提示词，用于描述不希望出现在视频中的内容。
        metadata:
          type: object
          description: 供应商扩展参数或业务元数据。
          additionalProperties: true
    VideoTask:
      type: object
      properties:
        id:
          type: string
          description: 视频任务 ID。
          example: task_123456
        task_id:
          type: string
          description: 视频任务 ID，兼容部分供应商返回结构。
          example: task_123456
        object:
          type: string
          description: 对象类型。
          example: video.generation
        status:
          type: string
          description: 任务状态，例如 pending、running、succeeded、failed。
          example: succeeded
        model:
          type: string
          description: 实际使用的视频模型 ID。
        created_at:
          type: integer
          description: 任务创建时间，Unix 秒级时间戳。
        updated_at:
          type: integer
          description: 任务更新时间，Unix 秒级时间戳。
        url:
          type: string
          format: uri
          description: 生成视频的访问 URL。
        content_url:
          type: string
          format: uri
          description: 可用于下载视频内容的 URL。
        output:
          type: array
          description: 供应商返回的扩展输出结果。
          items:
            type: object
            additionalProperties: true
        error:
          type: object
          description: 任务失败时的错误信息。
          additionalProperties: true
    LogListResponse:
      allOf:
        - $ref: '#/components/schemas/ManagementResponse'
        - type: object
          properties:
            data:
              type: object
              description: 日志分页数据。
              properties:
                items:
                  type: array
                  description: 日志记录列表。
                  items:
                    $ref: '#/components/schemas/LogRecord'
                total:
                  type: integer
                  description: 符合条件的日志总数。
    LogRecord:
      type: object
      properties:
        id:
          type: integer
          description: 日志 ID。
        user_id:
          type: integer
