          application/json:
            schema:
              $ref: '#/components/schemas/Seedance2VideoTaskRequest'
            examples:
              textToVideo:
                summary: 文生视频
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 一只金色柴犬在樱花树下奔跑，镜头缓缓上升
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  watermark: false
              imageToVideo:
                summary: 图片参考生成视频
                value:
                  model: doubao-seedance-2-0-fast-260128
                  content:
                    - type: text
                      text: 让画面中的人物缓缓转身微笑
                    - type: image_url
                      image_url:
                        url: https://example.com/photo.jpg
                      role: reference_image
                  resolution: 720p
                  ratio: '16:9'
                  duration: 5
                  watermark: false
              firstFrame:
                summary: 首帧图生视频
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 镜头环绕玩具机器人
                    - type: image_url
                      image_url:
                        url: https://example.com/start.png
                      role: first_frame
                  resolution: 720p
                  ratio: adaptive
                  duration: 5
                  generate_audio: true
                  watermark: false
              firstLastFrames:
                summary: 首尾帧图生视频
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 镜头从花园入口推进到喷泉
                    - type: image_url
                      image_url:
                        url: https://example.com/start.png
                      role: first_frame
                    - type: image_url
                      image_url:
                        url: https://example.com/end.png
                      role: last_frame
                  resolution: 720p
                  ratio: adaptive
                  duration: 5
                  generate_audio: true
                  watermark: false
              videoToVideo:
                summary: 视频生视频
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 让视频中的人物变成卡通风格
                    - type: video_url
                      video_url:
                        url: https://example.com/reference-video.mp4
                      role: reference_video
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  generate_audio: true
                  watermark: false
              imageAudioToVideo:
                summary: 音画协同
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 让人物根据音频内容说话
                    - type: image_url
                      image_url:
                        url: https://example.com/reference-image.jpg
                      role: reference_image
                    - type: audio_url
                      audio_url:
                        url: https://example.com/reference-audio.mp3
                      role: reference_audio
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  watermark: false
              imageVideoReference:
                summary: 多重引用
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 按照图片的风格，修改这个视频
                    - type: image_url
                      image_url:
                        url: https://example.com/reference-image.jpg
                      role: reference_image
                    - type: video_url
                      video_url:
                        url: https://example.com/reference-video.mp4
                      role: reference_video
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  watermark: false
              videoAudioToVideo:
                summary: 动态音效
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 根据音频内容为视频添加匹配的音效
                    - type: video_url
                      video_url:
                        url: https://example.com/reference-video.mp4
                      role: reference_video
                    - type: audio_url
                      audio_url:
                        url: https://example.com/reference-audio.mp3
                      role: reference_audio
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  watermark: false
              allModalities:
                summary: 全模态引用
                value:
                  model: doubao-seedance-2-0-260128
                  content:
                    - type: text
                      text: 使用图片的风格，把这个声音应用在女主说话的场景，并修改这个视频
                    - type: image_url
                      image_url:
                        url: https://example.com/reference_image.jpg
                      role: reference_image
                    - type: video_url
                      video_url:
                        url: https://example.com/reference-video.mp4
                      role: reference_video
                    - type: audio_url
                      audio_url:
                        url: https://example.com/reference_audio.mp3
                      role: reference_audio
                  resolution: 480p
                  ratio: '16:9'
                  duration: 5
                  generate_audio: true
                  watermark: false
      responses:
