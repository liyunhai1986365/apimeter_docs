      additionalProperties: true
    SunoMusicRequest:
      type: object
      description: Suno 音乐生成请求。
      properties:
        gpt_description_prompt:
          type: string
          description: 灵感模式下的音乐描述提示词，为空时可结合 tags 和标题生成。
          example: 一首关于乡愁的情绪朋克歌曲
        prompt:
          type: string
          description: 固定自定义歌词模式下的歌词文本，也可用于其他 Suno 兼容格式的提示词。自定义模式最多 3000 字，灵感模式最多 200 字；传入知名艺术家名称可能无法生成。
          example: "[Verse]\nWalking down the streets..."
        tags:
          type: string
          description: 音乐风格标签最多 120 字，可填写风格、乐器、人声、节奏等提示。
          example: emotional punk
        negative_tags:
          type: string
          description: 排除风格或不希望出现的元素。
          example: dance pop
        mv:
          type: string
          enum:
            - chirp-v4
            - chirp-v3-5
            - chirp-bluejay
            - chirp-auk
            - chirp-fenix
          description: Suno 模型版本或模式。支持 `chirp-v4`、`chirp-v3-5`、`chirp-bluejay`、`chirp-auk`、`chirp-fenix`；其中 `chirp-fenix` 对应 Suno 5.5 / 最新版，当前常见默认值为 `chirp-v3-5`。
          example: chirp-v4
        title:
          type: string
          description: 歌曲标题。
          example: 乡愁
        make_instrumental:
          oneOf:
            - type: boolean
            - type: integer
              enum:
                - 0
                - 1
          description: 是否纯音乐，传 1 表示生成纯音乐，传 0 或 false 表示非纯音乐；在特定任务中也可作为音轨分离参数使用。
          example: false
        task:
          type: string
          description: Suno 任务类型，例如 `gen_stem` 表示音轨分离。
          example: gen_stem
        stem_task:
          type: string
          description: 音轨分离任务类型。
          example: two
        task_id:
          type: string
          description: 需要继续处理的 Suno 任务 ID。
        continue_clip_id:
          type: string
          description: 续写或音轨分离时使用的上一段官方 clip_id，也可传已有 task_id。
          example: 90f72668-ba0d-4fa7-95e6-f71bebda88b7
        continue_at:
          type:
            - number
            - 'null'
          description: 续写时间点，即从上一段的什么时间点开始续写，单位通常为秒。
          example: 10
        cover_clip_id:
          type: string
          description: 用作封面或参考的歌曲片段 ID。
        custom_mode:
          oneOf:
            - type: boolean
            - type: integer
              enum:
                - 0
                - 1
          description: 是否自定义模式，默认 0 表示灵感模式，1 表示自定义模式。
          example: 1
        metadata:
          type: object
          description: 扩展元数据。可包含 `control_sliders` 等上游高级控制参数。
          properties:
            control_sliders:
              type: object
              description: Suno 高级控制滑块。
              properties:
                style_weight:
                  type: number
                  description: 风格权重。
                weirdness_constraint:
                  type: number
                  description: 风格发散或怪异度约束。
                audio_weight:
                  type: number
                  description: 参考音频权重。
            can_control_sliders:
              type: array
              description: 当前任务或模型支持的控制滑块名称。
              items:
                type: string
          additionalProperties: true
        callback_url:
          type: string
          format: uri
          description: Webhook 回调 URL。音乐生成完毕后，生成结果会主动以 POST 形式发送到该地址。
        gen_params:
          type: object
          description: Suno 兼容格式或上游扩展生成参数。
          additionalProperties: true
      additionalProperties: true
    SunoLyricsRequest:
      type: object
      required:
